name: Booru Video Importer
description: Stash-first exhaustive e621 video matcher. Processes one filtered local video at a time, rejects non-exact-duration e621 videos before opening media, verifies same-timecode frames, and imports authoritative e621 metadata on the first verified match.
version: 2.0.0

exec:
  - python
  - "{pluginDir}/BooruVideoImporter.py"

interface: raw
errLog: info

settings:
  stash_tag_scope:
    displayName: Stash Tag Scope (any tag or alias)
    description: Optional. Enter any existing Stash tag name or alias, for example furry. Only local video scenes carrying that tag are processed. Leave blank to process all eligible local videos.
    type: STRING

  skip_organized_scenes:
    displayName: Protect Organized Scenes
    description: When enabled, any Stash scene already marked Organized is skipped completely and no metadata is changed.
    type: BOOLEAN

  e621_pages_per_run:
    displayName: e621 History Pages per Stash Video per Run
    description: Number of e621 video-history pages to scan for the current local video before saving progress. The next run resumes the same local file. Leave blank or 0 to use 10 pages.
    type: NUMBER

  e621_username:
    displayName: e621 username
    description: Recommended for authenticated e621 API access.
    type: STRING

  e621_api_key:
    displayName: e621 API key
    description: Recommended with the e621 username. Never written to plugin logs.
    type: STRING

tasks:
  - name: Preview Next Stash Video Match (No Changes)
    description: Takes the next eligible local Stash video and scans a limited e621 history window. Only exact-duration WebM/MP4 posts are opened. Same-timecode frames are compared, but no metadata or progress is changed.
    defaultArgs:
      mode: match
      dry_run: true
      pages_per_run: 1
      local_limit: 1

  - name: Match Filtered Stash Videos Against e621
    description: Main importer. Keeps one local Stash video active while walking all e621 WebM then MP4 history. Non-exact-duration posts are skipped before opening media. Exact-duration candidates are tested sequentially at the same timecodes until one verifies; metadata is imported on the first match. If e621 history is exhausted with no match, the next local video begins from newest.
    defaultArgs:
      mode: match
      dry_run: false

  - name: Reset Matching Progress
    description: Clears saved progress for the current Stash Tag Scope. The next run starts the first eligible local video from the newest e621 WebM history again.
    defaultArgs:
      mode: reset
