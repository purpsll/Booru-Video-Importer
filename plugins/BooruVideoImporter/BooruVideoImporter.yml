name: Booru Video Importer
description: Matches Stash videos against a persistent local SQLite catalog of e621 WebM/MP4 metadata, exact durations, MD5s, sampled timecodes, and perceptual frame hashes. Exact MD5 matches import immediately; other matches use exact duration, local pHash comparison, and one live same-timecode midpoint verification.
version: 3.0.0

exec:
  - python
  - "{pluginDir}/BooruVideoImporter.py"

interface: raw
errLog: info

settings:
  stash_tag_scope:
    displayName: Stash Tag Scope (any tag or alias)
    description: Optional. Enter any existing Stash tag name or alias, for example furry. Only local video scenes carrying that tag are matched. Leave blank to process all eligible local videos.
    type: STRING

  skip_organized_scenes:
    displayName: Protect Organized Scenes
    description: When enabled, any Stash scene already marked Organized is skipped completely and no metadata is changed.
    type: BOOLEAN

  e621_username:
    displayName: e621 username
    description: Recommended for authenticated e621 API access while building/updating the catalog and fetching verified post metadata.
    type: STRING

  e621_api_key:
    displayName: e621 API key
    description: Recommended with the e621 username. Never written to plugin logs.
    type: STRING

tasks:
  - name: 1. Build / Update e621 Video Catalog
    description: Creates or resumes the persistent SQLite e621 video catalog. Crawls WebM/MP4 posts once, stores post ID, URL, MD5, exact duration and sampled 10/50/90 percent timecodes, and generates three DCT perceptual hashes per video. Later runs continue from saved e621 cursors and add only newer posts while retrying transient hash failures.
    defaultArgs:
      mode: catalog
      page_limit: 0
      hash_limit: 0

  - name: 2. Show e621 Video Catalog Status
    description: Reports catalog row count, hashed-video count, failed hashes, duration buckets, and current WebM/MP4 crawl cursors without changing anything.
    defaultArgs:
      mode: catalog_status

  - name: 3. Preview Next Stash Video Match (No Changes)
    description: Tests the next eligible local Stash video against the local e621 catalog. MD5 is checked first, then exact-duration rows and cached pHashes. Only plausible candidates are opened for one same-timecode midpoint-frame verification. Makes no Stash metadata changes.
    defaultArgs:
      mode: match
      dry_run: true
      local_limit: 1

  - name: 4. Match Filtered Stash Videos Against e621 Catalog
    description: Main importer. Uses the persistent catalog instead of rescanning e621 history for each Stash file. Exact MD5 matches import immediately. Otherwise only exact-duration catalog rows are compared by cached 10/50/90 percent pHashes, and only plausible candidates are fetched for one live midpoint-frame verification before authoritative e621 metadata is imported.
    defaultArgs:
      mode: match
      dry_run: false
