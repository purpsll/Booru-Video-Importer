name: Booru Video Importer
description: Separate scene/video matcher for e621 and Rule34. Supports exact MD5, local-first reverse search, and e621 source-first matching that compares early video frames against a cached local Stash frame index before full multi-frame verification.
version: 1.1.3

exec:
  - python
  - "{pluginDir}/BooruVideoImporter.py"

interface: raw
errLog: info

settings:
  stash_tag_scope:
    displayName: Stash Tag Scope (any tag or alias)
    description: Optional. Enter any existing Stash tag name or alias, for example furry. The plugin resolves it live against your Stash tags and processes only video scenes carrying that tag. Leave blank to process all eligible videos.
    type: STRING

  skip_organized_scenes:
    displayName: Protect Organized Scenes
    description: When enabled, any Stash scene already marked Organized is skipped completely. The plugin will not add tags, performers, studio, URLs, dates, or workflow markers to that scene.
    type: BOOLEAN

  source_first_duration_tolerance_seconds:
    displayName: Source-First Duration Tolerance (seconds)
    description: e621 videos are compared only to local Stash scenes within this many seconds of the same duration before any frame hashing is attempted. Default 1.0 second.
    type: NUMBER

  source_first_auto_import:
    displayName: Allow Source-First Auto Import
    description: Off by default for safety. When disabled, even high-confidence e621 source-first matches are sent to Booru Video Review instead of writing source metadata automatically.
    type: BOOLEAN

  e621_source_pages:
    displayName: e621 Source-First Pages per Run
    description: Number of e621 pages to inspect during source-first matching. Each page checks up to 75 WebM and 75 MP4 posts. Leave 0 or blank to use 5 pages.
    type: NUMBER

  e621_username:
    displayName: e621 username
    description: Recommended. Enables authenticated e621 API requests and ERIS frame discovery.
    type: STRING

  e621_api_key:
    displayName: e621 API key
    description: Recommended with the e621 username. Never written to plugin logs.
    type: STRING

  rule34_user_id:
    displayName: Rule34 user ID
    description: Required for authoritative Rule34 post/tag metadata resolution.
    type: STRING

  rule34_api_key:
    displayName: Rule34 API key
    description: Required with the Rule34 user ID. Never written to plugin logs.
    type: STRING

  saucenao_api_key:
    displayName: SauceNAO API key
    description: Strongly recommended for Deep Reverse Search. SauceNAO is used only to locate e621/Rule34 candidate posts from video frames; metadata always comes from the source booru.
    type: STRING

  saucenao_requests_per_30_seconds:
    displayName: SauceNAO searches per 30 seconds
    description: Leave blank or 0 for Auto. The plugin learns the account short-term allowance from SauceNAO responses, including paid accounts. Set a positive number only to cap it lower.
    type: NUMBER

tasks:
  - name: 1. Scan Unprocessed Videos (Fast)
    description: Start here. Checks unclassified Stash scenes for exact video-file MD5 matches on e621 and Rule34. If Stash Tag Scope is set, only scenes carrying that tag are scanned. Exact video matches import metadata immediately; misses are queued as Booru Video Unresolved.
    defaultArgs:
      mode: import_all
      lookup_mode: fast
      dry_run: false

  - name: 2. Preview Deep Reverse Search (10 Videos, No Changes)
    description: Tests the next 10 unresolved videos without changing Stash. Extracts representative frames, locates e621/Rule34 candidates, and verifies actual candidate videos across multiple perceptual frame hashes.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: true
      limit: 10

  - name: 3. Deep Reverse Search All Unresolved Videos
    description: Runs frame-based reverse search only on Booru Video Unresolved scenes. Verified matches import authoritative tags, source URLs, date, characters as performers, and artist/studio metadata. Borderline multi-frame matches become Booru Video Review.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: false

  - name: 4. Recheck Video Review Candidates
    description: Re-runs full video verification on scenes currently tagged Booru Video Review.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: false
      only_review: true

  - name: 5. Retry Video No-Match Scenes
    description: Rechecks scenes currently tagged Booru Video No Match after source indexes may have changed.
    defaultArgs:
      mode: import_all
      lookup_mode: deep
      dry_run: false
      only_no_match: true

  - name: 6. Build / Refresh Local Video Frame Index
    description: Builds a cached early-frame hash index for eligible Stash scenes. If Stash Tag Scope is set, only scenes carrying that live Stash tag or alias are indexed. Unchanged files reuse cached hashes on later runs.
    defaultArgs:
      mode: build_source_index
      force_index: false

  - name: 7. Preview e621 Source-First Match (25 Posts, No Changes)
    description: Checks up to 25 recent e621 WebM/MP4 posts against the local frame index. Early-frame similarity only nominates candidates; full multi-frame verification is still required. Makes no Stash metadata changes.
    defaultArgs:
      mode: source_first_e621
      dry_run: true
      source_pages: 1
      source_post_limit: 25

  - name: 8. Match e621 Videos to Local Stash
    description: Scans recent e621 WebM/MP4 posts outward against the selected Stash Tag Scope. Duration is checked first; only local scenes within 1 second by default are frame-compared. Candidates require two aligned early-frame matches and ultra-strict full-video verification. High-confidence results go to Review unless Allow Source-First Auto Import is enabled.
    defaultArgs:
      mode: source_first_e621
      dry_run: false

