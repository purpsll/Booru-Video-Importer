name: Test Booru Video Importer

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile Python
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m compileall -q plugins/BooruVideoImporter

      - name: Run unit tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/BooruVideoImporter/tests -v
