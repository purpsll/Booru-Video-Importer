name: Deploy Stash Plugin Source

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'build_site.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Stash plugin source
        run: |
          set -euo pipefail
          chmod +x build_site.sh
          ./build_site.sh _site/${{ github.ref_name }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}main/index.yml
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
